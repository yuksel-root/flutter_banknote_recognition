name: flutter_banknote_recognition
description: "Çevrimdışı Türk lirası banknot tanıma ve güvenlik özelliği rehberi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  tflite_flutter: ^0.11.0
  camera: ^0.11.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.0
  image: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/security_features.json
